<div [ngClass]="{ 'no-click': disabled }" class="header-wrapper">
  <div class="letters-row">
    <i
      (click)="onHelpClick()"
      (keyup.enter)="onHelpClick()"
      tabindex="0"
      role="button"
      aria-label="Help"
      class="icon fa-regular fa-lg fa-circle-question"
    ></i>
    <app-square [header]="true" clueNumber="15" letter="C"></app-square>
    <app-square [header]="true" letter="R"></app-square>
    <app-square [header]="true" letter="A"></app-square>
    <app-square [header]="true" letter="W"></app-square>
    <app-square [header]="true" letter="S"></app-square>
    <app-square [header]="true" letter="W"></app-square>
    <app-square [header]="true" letter="O"></app-square>
    <app-square [header]="true" letter="R"></app-square>
    <app-square [header]="true" letter="D"></app-square>
    <div ngbDropdown class="menu d-inline-block">
      <i class="fa-solid fa-bars" id="dropdownBasic1" ngbDropdownToggle></i>
      <div class="noselect" ngbDropdownMenu aria-labelledby="dropdownBasic1">
        @if (!practiceMode) {
          <button (click)="onMenuPress('practice')" ngbDropdownItem>
            Practice mode
          </button>
        }
        @if (practiceMode) {
          <button (click)="onMenuPress('practice')" ngbDropdownItem>
            Daily puzzle
          </button>
        }
        @if (practiceMode) {
          <button (click)="onMenuPress('restart')" ngbDropdownItem>
            Restart practice
          </button>
        }
        <button (click)="onMenuPress('welcome')" ngbDropdownItem>
          How to play
        </button>
        <button (click)="onMenuPress('settings')" ngbDropdownItem>
          Settings
        </button>
        <button (click)="onMenuPress('about')" ngbDropdownItem>About</button>
        <!-- <button (click)="onDonatePress()" ngbDropdownItem>Donate</button> -->
      </div>
    </div>
  </div>
</div>
